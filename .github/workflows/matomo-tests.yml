# Action for running tests
# This file has been automatically created.
# To recreate it you can run this command
# ./console generate:test-action --plugin="ChatGPT" --php-versions="8.1,8.5"
# Third-party actions are pinned to reviewed commit SHAs, Dependabot proposes the updates.

name: Plugin ChatGPT Tests

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - '**.x-dev'
  workflow_dispatch:

permissions:
  actions: read
  checks: none
  contents: read
  deployments: none
  issues: read
  packages: none
  pull-requests: read
  repository-projects: none
  security-events: none
  statuses: none

concurrency:
  group: php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  PluginTests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.5' ]
        target: ['minimum_required_matomo', 'maximum_supported_matomo']
        database:
          - { engine: 'Mysql', version: '8.0' }
          - { engine: 'Mariadb', version: '10.6' }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false
      - name: Run tests
        uses: matomo-org/github-action-tests@64f58dd678ee4d5b5f0f194a496d3bb8c15adc45 # main as of 2026-10-06
        with:
          plugin-name: 'ChatGPT'
          php-version: ${{ matrix.php }}
          test-type: 'PluginTests'
          mysql-engine: ${{ matrix.database.engine }}
          mysql-version: ${{ matrix.database.version }}
          matomo-test-branch: ${{ matrix.target }}
          artifacts-pass: ${{ github.event_name != 'pull_request' && secrets.ARTIFACTS_PASS || '' }}
          upload-artifacts: ${{ matrix.php == '8.1' && matrix.target == 'maximum_supported_matomo' && matrix.database.engine == 'Mysql' }}
  Client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        target: ['minimum_required_matomo', 'maximum_supported_matomo']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: false
          persist-credentials: false
      - name: running tests
        uses: matomo-org/github-action-tests@64f58dd678ee4d5b5f0f194a496d3bb8c15adc45 # main as of 2026-10-06
        with:
          plugin-name: 'ChatGPT'
          matomo-test-branch: ${{ matrix.target }}
          test-type: 'Client'
          node-version: '24'
          mysql-service: false
